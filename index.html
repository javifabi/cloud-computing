<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Computing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="contenedor">

    <img src="logo-santo-tomas.jpg" alt="Logo Santo Tomás" class="logo">

    <h1>Cloud Computing</h1>

    <h2>Mi primer sistema Cloud</h2>

    <p>
        Sistema creado en la asignatura Computación en la Nube del Instituto Profesional Santo Tomás
    </p>

    <hr>

    <h2>Registro de usuarios</h2>

    <form id="formulario">

        <input 
            type="text"
            id="nombre"
            placeholder="Ingrese nombre"
            required
        >

        <input 
            type="date"
            id="fecha"
            required
        >

        <button type="submit">
            Guardar
        </button>

    </form>

    <h2>Datos guardados</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaDatos">
        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
